server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: pms-backend
  datasource:
    url: jdbc:mysql://localhost:3306/pms?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PMS_DB_USERNAME:root}
    password: ${PMS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  main:
    allow-circular-references: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置
pms:
  # 附件上传根目录(相对后端运行目录, 启动时自动创建)
  upload-dir: ${PMS_UPLOAD_DIR:./uploads}
  cors:
    # 逗号分隔的可信前端来源
    allowed-origins: ${PMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # JWT 密钥必须通过环境变量注入，且长度至少满足 HS256 要求
    secret: ${PMS_JWT_SECRET:}
    # token 有效期(毫秒): 12小时
    expire: ${PMS_JWT_EXPIRE:43200000}

logging:
  level:
    com.pms: info
